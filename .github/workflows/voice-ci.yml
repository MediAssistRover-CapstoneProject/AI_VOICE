name: AI Voice CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test robot voice and deployment scripts
        run: |
          python -m pip install -r deploy/ec2/requirements.txt 'pytest>=8,<10' 'python-multipart>=0.0.18,<1'
          python -m pytest -q tests/test_robot_api_latency.py tests/test_faq.py
          bash -n deploy/ec2/install.sh
          bash -n deploy/ec2/media-edge.sh

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AI_VOICE_DEPLOY_ROLE_ARN != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: mar-voice-media-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      ARTIFACT_BUCKET: ${{ vars.AI_VOICE_ARTIFACT_BUCKET }}
      MEDIA_INSTANCE: ${{ vars.AI_VOICE_MEDIA_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AI_VOICE_DEPLOY_ROLE_ARN }}
      - name: Deploy verified release to the media EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $MEDIA_INSTANCE =~ ^i-[0-9a-f]+$ && $ARTIFACT_BUCKET =~ ^[a-z0-9][a-z0-9.-]+$ ]]
          artifact=$(mktemp)
          trap 'rm -f -- "$artifact"' EXIT
          tar --exclude='__pycache__' -czf "$artifact" src deploy/ec2 backend/requirements.voice.txt data/faqs.json data/hospital_vector_store.json
          checksum=$(sha256sum "$artifact" | cut -d' ' -f1)
          key="s3://$ARTIFACT_BUCKET/ai-voice/releases/$GITHUB_SHA.tar.gz"
          aws s3 cp "$artifact" "$key" --only-show-errors
          url=$(aws s3 presign "$key" --expires-in 900)
          echo "::add-mask::$url"
          command=$(cat <<SCRIPT
          set -eu
          stage=\$(mktemp -d /var/tmp/mar-voice-ci.XXXXXX)
          trap 'rm -rf -- "\$stage"' EXIT
          curl -fsS --proto '=https' --max-time 60 -o "\$stage/release.tgz" '$url'
          printf '%s  %s\n' '$checksum' "\$stage/release.tgz" | sha256sum -c -
          tar -xzf "\$stage/release.tgz" -C "\$stage"
          bash "\$stage/deploy/ec2/install.sh" '$GITHUB_SHA'
          SCRIPT
          )
          params=$(jq -cn --arg command "$command" '{commands:[$command],executionTimeout:["900"]}')
          id=$(aws ssm send-command --instance-ids "$MEDIA_INSTANCE" --document-name AWS-RunShellScript --comment "MAR AI Voice $GITHUB_SHA" --parameters "$params" --query Command.CommandId --output text)
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$MEDIA_INSTANCE" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo "Voice release ready on media EC2 ($GITHUB_SHA)"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "SSM deploy $status ($id)" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "SSM deploy is still pending ($id)" >&2
          exit 1
